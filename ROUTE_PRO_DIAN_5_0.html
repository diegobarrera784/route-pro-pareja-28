<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b5d"><meta name="apple-mobile-web-app-capable" content="yes"><title>ROUTE PRO DIAN 5.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#123b5d;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:23px}.sub{font-size:13px;opacity:.85;margin-top:4px}main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 4px 16px #0001}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{background:#e9f0f6;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800}.muted{color:#687587;font-size:13px}.upload,button,.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:9px;font-size:16px;font-weight:800;text-align:center;text-decoration:none}.upload,.primary{background:#16805c;color:#fff}.blue{background:#2167c7;color:#fff}.dark{background:#123b5d;color:#fff}.gray{background:#e9eef4;color:#172033}.red{background:#f4dddd;color:#7b2222}input[type=file]{display:none}select{width:100%;padding:12px;border:1px solid #d5dce4;border-radius:12px;margin-top:5px;background:#fff;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.progress{height:9px;background:#e2e7ed;border-radius:99px;overflow:hidden;margin:9px 0}.bar{height:100%;background:#16805c;width:0}.stop{padding:12px 0;border-bottom:1px solid #edf0f3}.stop:last-child{border:0}.done{opacity:.45;text-decoration:line-through}.zone{margin-top:12px;padding:8px 10px;background:#eef4f7;border-radius:10px;font-size:13px;font-weight:800}.dist{color:#16805c;font-size:12px;font-weight:800}#toast{position:fixed;left:15px;right:15px;bottom:18px;background:#172033;color:#fff;padding:13px;border-radius:13px;display:none;z-index:20}</style></head><body><header><h1>🧭 ROUTE PRO DIAN 5.0</h1><div class="sub">Carga visitas · agrupa · ordena · navega</div></header><main><section class="card"><h2>📂 Cargar archivo de visitas</h2><label class="upload" for="file">SELECCIONAR HTML DE LA RUTA</label><input id="file" type="file" accept=".html,.htm,text/html"><div id="info" class="muted" style="margin-top:9px">Compatible con mapas HTML de Folium/Leaflet.</div></section><section id="cfg" class="card" style="display:none"><h2>🧠 Organización automática</h2><div class="grid"><label class="muted">Modo<select id="mode"><option value="walking">🚶 A pie</option><option value="driving">🚗 Vehículo</option></select></label><label class="muted">Zonas<select id="zones"><option value="auto">Automático</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></div><button class="blue" onclick="locate()">📍 USAR MI UBICACIÓN COMO INICIO</button><button class="dark" onclick="optimize()">🧠 ORGANIZAR RUTA</button><div id="opt" class="muted" style="margin-top:8px"></div></section><section id="routeCard" class="card" style="display:none"><div class="row"><b>Progreso</b><span id="prog" class="pill">0/0</span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="current"></div><button class="primary" onclick="navigateNext()">🧭 NAVEGAR A SIGUIENTE</button><button class="gray" onclick="done()">✅ MARCAR VISITA REALIZADA</button><button class="blue" onclick="nearest()">📍 VISITA MÁS CERCANA</button></section><section id="summary" class="card" style="display:none"></section><section id="listCard" class="card" style="display:none"><details open><summary><b>📋 Ruta por zonas</b></summary><div id="list"></div></details></section><section id="tools" class="card" style="display:none"><button class="gray" onclick="share()">📤 COMPARTIR</button><button class="gray" onclick="copyAddress()">📋 COPIAR DIRECCIÓN</button><button class="gray" onclick="optimize()">🔄 RECALCULAR</button><button class="red" onclick="resetAll()">🗑️ NUEVA RUTA</button></section></main><div id="toast"></div><script>
let stops=[],route=[],status=[],cur=0,start=null,clusters=[];const $=id=>document.getElementById(id);function toast(t){let e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)}function clean(s){return(s||"").replace(/<br\s*\/?>/gi," | ").replace(/<[^>]*>/g," ").replace(/&nbsp;/gi," ").replace(/\\u[0-9a-fA-F]{4}/g,x=>String.fromCharCode(parseInt(x.slice(2),16))).replace(/\\n/g," ").replace(/\s+/g," ").trim()}function dist(a,b){let R=6371,p=Math.PI/180,x=(b.lat-a.lat)*p,y=(b.lon-a.lon)*p,q=Math.sin(x/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(y/2)**2;return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}function extract(txt){let out=[],re=/L\.(?:marker|circleMarker)\(\s*\[\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\]/g,m,n=0;while(m=re.exec(txt)){let ma=txt.indexOf("L.marker(",re.lastIndex),mb=txt.indexOf("L.circleMarker(",re.lastIndex),end=(ma<0?mb:(mb<0?ma:Math.min(ma,mb)));let block=txt.slice(m.index,end<0?txt.length:end),t=clean(block);let nit=(t.match(/\bNIT\b\s*[:\-]?\s*([0-9.\-]{6,})/i)||[])[1]||"";let addr=(t.match(/(?:Direcci[oó]n|Dirección)\s*[:\-]?\s*([^|]+)/i)||[])[1]||((t.match(/((?:CALLE|CARRERA|CRA|CLL|AVENIDA|DIAGONAL|TRANSVERSAL)[^|]{5,80})/i)||[])[1]||"Medellín");let parts=t.split("|").map(x=>x.trim()).filter(Boolean),name=(t.match(/(?:Nombre|Raz[oó]n social|RAZ[ÓO]N SOCIAL|Empresa)\s*[:\-]\s*([^|]+)/i)||[])[1]||parts.find(x=>x.length>5&&!/NIT|Direcci[oó]n|Medell[ií]n/i.test(x))||("Visita "+(++n));out.push({id:n++,name:name.trim(),nit,address:addr.trim(),lat:+m[1],lon:+m[2]})}return out}$("file").onchange=async e=>{let f=e.target.files[0];if(!f)return;stops=extract(await f.text());if(!stops.length){toast("No encontré visitas en ese HTML");return}status=stops.map(()=>"PENDIENTE");cur=0;$("cfg").style.display="block";$("info").innerHTML='<b>'+f.name+'</b> · '+stops.length+' visitas detectadas';optimize()};function locate(){navigator.geolocation.getCurrentPosition(p=>{start={lat:p.coords.latitude,lon:p.coords.longitude};toast("📍 Inicio tomado de tu ubicación");optimize()},()=>toast("No se pudo obtener ubicación"),{enableHighAccuracy:true,timeout:10000})}function nearestOrder(arr,s){let r=[],a=arr.slice(),c=s;while(a.length){let bi=0,bd=1e9;a.forEach((x,i)=>{let d=dist(c,x);if(d<bd){bd=d;bi=i}});c=a.splice(bi,1)[0];r.push(c)}return r}function optimize(){if(!stops.length)return;let s=start||stops[0],r=nearestOrder(stops,s),z=$("zones").value;let k=z==="auto"?Math.max(1,Math.min(5,Math.ceil(r.length/6))):+z;clusters=[];for(let i=0;i<k;i++)clusters.push(r.slice(Math.floor(i*r.length/k),Math.floor((i+1)*r.length/k)));route=clusters.flat();status=route.map(x=>status[stops.findIndex(s=>s.id===x.id)]||"PENDIENTE");cur=0;render();let km=route.reduce((q,x,i)=>i?q+dist(route[i-1],x):q,0);$("opt").textContent=route.length+' visitas · '+clusters.length+' zonas · '+km.toFixed(2)+' km aproximados entre puntos';}function next(){for(let i=cur;i<route.length;i++)if(status[i]!=="REALIZADO")return i;for(let i=0;i<cur;i++)if(status[i]!=="REALIZADO")return i;return-1}function url(s){return`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=${$("mode").value}&dir_action=navigate`}function navigateNext(){let i=next();if(i<0)return toast("🎉 Ruta completada");cur=i;status[i]="EN CAMINO";render();location.href=url(route[i])}function done(){let i=next();if(i<0)return;status[i]="REALIZADO";cur=Math.min(i+1,route.length-1);render();toast("✅ Visita realizada")}function nearest(){navigator.geolocation.getCurrentPosition(p=>{let bi=-1,bd=1e9;route.forEach((x,i)=>{if(status[i]==="REALIZADO")return;let d=dist({lat:p.coords.latitude,lon:p.coords.longitude},x);if(d<bd){bd=d;bi=i}});if(bi>=0){cur=bi;render();toast("📍 Más cercana: "+route[bi].name)}},()=>toast("Activa ubicación"),{enableHighAccuracy:true,timeout:10000})}function copyAddress(){let i=next();if(i>=0)navigator.clipboard?.writeText(route[i].address).then(()=>toast("📋 Dirección copiada"))}function share(){navigator.share?navigator.share({title:"ROUTE PRO DIAN 5.0",text:"Organizador de rutas",url:location.href}):toast("Usa Compartir de Safari")}function resetAll(){if(confirm("¿Cargar una nueva ruta?"))location.reload()}function render(){$("routeCard").style.display=$("summary").style.display=$("listCard").style.display=$("tools").style.display="block";let d=status.filter(x=>x==="REALIZADO").length;$("prog").textContent=d+"/"+route.length;$("bar").style.width=(d/route.length*100)+"%";let i=next();$("current").innerHTML=i<0?"<h2>🎉 Ruta completada</h2>":'<span class="pill">VISITA '+(i+1)+' DE '+route.length+' · '+status[i]+'</span><h2>'+route[i].name+'</h2><div>'+route[i].address+'</div><div class="muted">NIT '+(route[i].nit||"No detectado")+'</div><a class="btn primary" href="'+url(route[i])+'">📍 ABRIR GOOGLE MAPS</a>';$('summary').innerHTML='<b>🧠 Organización automática</b><p class="muted">La ruta se ordena por cercanía geográfica y se divide en zonas contiguas. La distancia es aproximada en línea recta; Google Maps calcula el trayecto real por calles.</p>';let h="";clusters.forEach((c,z)=>{h+='<div class="zone">📍 ZONA '+(z+1)+' · '+c.length+' visitas</div>';c.forEach(s=>{let j=route.findIndex(x=>x.id===s.id),dd=j?dist(route[j-1],s).toFixed(2)+' km':'';h+='<div class="stop '+(status[j]==="REALIZADO"?'done':'')+'"><div class="row"><b>'+(j+1)+'. '+s.name+'</b><span class="dist">'+dd+'</span></div><div class="muted">'+s.address+' · '+status[j]+'</div></div>'})});$('list').innerHTML=h}
</script></body></html>
